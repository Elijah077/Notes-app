<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="notes-container">
      <!-- search, filter-by-category and add notes -->

      <div class="filter-container">
        <div class="s-container">
          <input type="search" name="search" id="searchInput" placeholder="search notes" />
        </div>

        <!-- disply by saved-category -->
        <div class="category-container">
          <select name="notes" id="notesCategories">
            <option value="all">--All--</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Business">Business</option>
            <option value="Reminders">Reminders</option>
          </select>
        </div>

        <!-- Add-notes -->
        <button type="button" id="addTask">Add</button>
      </div>

      <!-- section to display aved notes -->

      <div class="saved-notes"></div>
    </section>

    <section class="add-notes-container">
      <form action="" class="add-notes">
        <h3>Write your new Note here</h3>
        <div class="form-group">
          <input type="text" required class="task-input" />
          <label class="task-label" for="title">Title</label>
        </div>
        <div class="form-group">
          <input type="text" required class="task-input" />
          <label class="task-label" for="Description">Description</label>
        </div>
        <div class="notes-area">
          <label for="new-notes" style="text-align: center">--Enter New Notes--</label>
          <textarea id="newNotes" cols="5" rows="6"></textarea>
        </div>

        <button type="submit">Send</button>
      </form>
    </section>

    <script src="app.js"></script>
  </body>
</html>
